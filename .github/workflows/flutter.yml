name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      # Avec Flutter 3.50, flutter analyze émet ~57 infos deprecated_member_use
      # venant du SDK lui-même et sort avec le code 1. On garde les erreurs et
      # les warnings bloquants, sans faire échouer la CI sur ces infos.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release
