name: suivi_budget
description: "MyBudget — gestion de budget personnelle, 100 % locale et hors ligne."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  floor: ^1.5.0
  sqflite_common_ffi_web: ^0.4.5
  flutter:
    sdk: flutter

  gap: ^3.0.1
  intl: ^0.20.2
  local_auth: ^3.0.1
  provider: ^6.1.5+1
  skeletonizer: ^2.1.3
  top_snackbar_flutter: ^3.3.0
  sqflite: ^2.4.2
  # Nécessaires au runtime desktop (Linux/Windows) via sqflite_common_ffi.
  sqflite_common_ffi: ^2.4.0
  sqlite3: ^3.1.6
  package_info_plus: ^10.2.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  floor_generator: ^1.5.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700